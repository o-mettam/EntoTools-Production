name = 'entotools'
compatibility_date = "2024-12-01"
pages_build_output_dir = "./public"
# @simplewebauthn/server (#35) is designed to be edge/Workers-safe, but its
# dependency tree wasn't installed or bundle-tested in this change (see
# README "Account system setup") — nodejs_compat is a no-op safety net if
# something transitively expects a Node global (Buffer, etc.) that the
# Workers runtime doesn't provide natively. Remove it if a real build proves
# it's unnecessary.
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "GEOCODE_CACHE"
id = "f44e390b2fba41c78dc6e6fa2c487a9c"

# Accounts (#35) / admin portal (#36) / feature flags (#37).
# Binding is "DB" (not the "entotools_accounts" name wrangler suggested when
# the database was created) — the binding name just has to match what
# src/lib/db.js references (env.DB), it doesn't need to match wrangler's
# auto-generated suggestion. Apply the schema once, in order:
#   wrangler d1 execute entotools-accounts --file=migrations/0001_accounts.sql
#   wrangler d1 execute entotools-accounts --file=migrations/0002_admin_audit.sql
#   wrangler d1 execute entotools-accounts --file=migrations/0003_feature_flags.sql
#   …through migrations/0011_single_use_tokens.sql (see docs/feature-flags.md)
#   0011 must be applied BEFORE deploying v1.12.2 — passkey sign-in uses it.
# (add --remote to each once verified against a local copy)
[[d1_databases]]
binding = "DB"
database_name = "entotools-accounts"
database_id = "6290f7de-5acf-44e8-ba0a-8e4caba3af82"

# ── Preview deployments (security assessment 2026-11, #2) ────────────
# Without an [env.preview] section, the bindings above apply to EVERY
# deployment — so a preview build of any pushed branch
# (<branch>.entotools-production.pages.dev) runs that branch's code against
# the PRODUCTION accounts database and KV. To isolate previews:
#   1. wrangler d1 create entotools-accounts-preview
#      wrangler kv namespace create GEOCODE_CACHE_PREVIEW
#   2. Apply every migrations/*.sql to the preview DB (as above, with
#      --remote and the preview database name).
#   3. Uncomment the block below and paste in the two new ids.
# Pages requires bindings to be restated in full inside an env section;
# nothing is inherited from the top level once it exists.
# Also recommended: Pages → Settings → General → "Enable access policy" for
# preview deployments, so preview URLs aren't public at all.
#
# [env.preview]
# compatibility_flags = ["nodejs_compat"]
# [[env.preview.kv_namespaces]]
# binding = "GEOCODE_CACHE"
# id = "<preview KV namespace id>"
# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "entotools-accounts-preview"
# database_id = "<preview D1 database id>"

# Secrets (set in the dashboard or with `wrangler pages secret put`, never here):
#   GITHUB_TOKEN  — feedback → GitHub issues (fine-grained, Issues: write, this repo only)
#   IP_HASH_KEY   — HMAC key for rate-limit keys (assessment 2026-11, #6); any
#                   long random string, e.g. `openssl rand -base64 32`

# CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD gate the admin portal (#36) — set
# these as Pages environment variables in the Cloudflare dashboard (Settings →
# Environment variables) AFTER creating the Access application, rather than
# here, since this file is committed to a public repo. See README "Admin
# portal setup" for the exact steps (this is a dashboard-only action; it
# cannot be scripted from this repo).
